[package]
name = "noi-gov"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# What Mero uses to ask Governance's server "may they?", over loopback.
client = ["dep:reqwest"]
# Governance's own server: schema gov, passkeys, sessions, run tokens, grants, "may they?" and the
# record. Mero uses only the boundary types, the Cedar checks and the client, so it builds without this.
server = [
    "client", "dep:noi-log", "dep:tracing", "dep:axum", "dep:tokio", "dep:sqlx", "dep:webauthn-rs", "dep:jsonwebtoken", "dep:rand",
    "dep:sha2", "dep:base64", "dep:clap", "dep:url", "dep:chrono", "dep:ed25519-dalek", "dep:thiserror",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
cedar-policy = "4.14.1"
axum = { version = "0.8", optional = true }
noi-log = { path = "../noi-log", optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"], optional = true }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"], optional = true }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"], optional = true }
rand = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = { version = "2", optional = true }
chrono = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "noi-gov"
path = "src/bin/noi-gov.rs"
required-features = ["server"]
