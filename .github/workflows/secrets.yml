# Secrets stay out (Going Public on GitHub decision 7, agreed 8 Nov). Fails if a database login, a key or
# an env file is ever tracked, whatever else changed. GitHub's secret scanning and push protection are the
# other half, turned on in the repository's settings.
name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: No secret files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for secret files in the repository
        run: |
          tracked=$(git ls-files | grep -E '(^|/)[^/]+\.local\.[^/]+$|\.(pem|key|p12|pfx)$|(^|/)\.env(\.[^/]*)?$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::These files must never be in the repository:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret files tracked."
