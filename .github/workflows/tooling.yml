name: Development tools

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/tooling.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/tooling.yml'

permissions:
  contents: read

jobs:
  scripts:
    name: Development script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check.mjs --scripts
